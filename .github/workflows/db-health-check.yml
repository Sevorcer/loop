name: Daily DB Health Check

# Runs daily at 06:00 UTC and can also be triggered manually.
#
# Required GitHub secrets (same set as Database Migrations workflow):
#   SUPABASE_ACCESS_TOKEN   — Personal access token from app.supabase.com/account/tokens
#   SUPABASE_PROJECT_REF    — Project reference ID (e.g. "abcdefghijklmnop")
#   SUPABASE_DB_PASSWORD    — Database password for the linked project
#
# The JSON health report is uploaded as a workflow artifact named
# "db-health-report-<run-id>" and retained for 30 days.

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger — no inputs required

permissions:
  contents: read

jobs:
  health-check:
    name: DB health check
    runs-on: ubuntu-latest

    # Skip on fork PRs (secrets unavailable) and dependabot.
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_PROJECT_REF"  ] || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
          CLEAN_DB_PASSWORD=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$CLEAN_DB_PASSWORD"
          [ -n "$CLEAN_DB_PASSWORD" ] || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          # Construct the direct DB URL and mask it immediately
          DB_URL="postgresql://postgres:${CLEAN_DB_PASSWORD}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres"
          echo "::add-mask::$DB_URL"
          echo "LOOP_DB_URL=$DB_URL"                     >> "$GITHUB_ENV"
          echo "DB_HEALTH_OUTPUT_FILE=/tmp/db-health-report.json" >> "$GITHUB_ENV"
          # Clear the raw password from the environment
          echo "SUPABASE_DB_PASSWORD=" >> "$GITHUB_ENV"

      - name: Ensure database is active
        run: |
          STATUS=$(curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            -H "Authorization: ******" \
            | jq -r '.status // "UNKNOWN"' || echo "UNKNOWN")
          echo "Project status: $STATUS"
          if [ "$STATUS" = "INACTIVE" ]; then
            echo "Project is paused — requesting restore..."
            curl -sf -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore" \
              -H "Authorization: ******" \
              -H "Content-Type: application/json" \
              -d '{}' || true
          fi
          if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "COMING_UP" ]; then
            echo "Waiting up to 3 min for database to become active..."
            for i in $(seq 1 18); do
              sleep 10
              STATUS=$(curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
                -H "Authorization: ******" \
                | jq -r '.status // "UNKNOWN"' || echo "UNKNOWN")
              echo "  Status: $STATUS (attempt $i/18)"
              [ "$STATUS" = "ACTIVE_HEALTHY" ] && break
            done
            if [ "$STATUS" != "ACTIVE_HEALTHY" ]; then
              echo "::warning::Project may not be fully active yet (status: $STATUS). Proceeding..."
            fi
          fi

      - name: Run DB health checks
        run: bash scripts/db-health-check.sh

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-health-report-${{ github.run_id }}
          path: /tmp/db-health-report.json
          retention-days: 30
          if-no-files-found: warn
