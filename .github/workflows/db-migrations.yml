name: Database Migrations

# Runs on every PR that touches migration or Supabase config files.
# Also runs on push to main to apply migrations to the primary environment.
#
# Required GitHub secrets:
#   SUPABASE_ACCESS_TOKEN   — Personal access token from app.supabase.com/account/tokens
#   SUPABASE_PROJECT_REF    — Project reference ID (e.g. "abcdefghijklmnop")
#   SUPABASE_DB_PASSWORD    — Database password for the linked project
#

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/verifications/**"
      - "supabase/config.toml"
      - "scripts/verify-migrations.sh"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/verifications/**"
      - "supabase/config.toml"

permissions:
  contents: read

jobs:
  # ── Structural validation ──────────────────────────────────────────────────
  # Runs on every PR — no database credentials required.
  # Validates that migration files follow naming conventions, are ordered
  # correctly, and that every migration has a companion .verify.sql file
  # (Check 5 in scripts/verify-migrations.sh — issue #118/#119).
  verify-structure:
    name: Verify migration structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration file sequence
        run: bash scripts/verify-migrations.sh

  # ── Apply & drift check ────────────────────────────────────────────────────
  # Runs only when Supabase credentials are available (i.e. not on fork PRs or
  # bot-authored PRs where GitHub withholds repository secrets).
  # Applies pending migrations to the linked project and fails if schema
  # drift is detected after the apply.
  apply-and-verify:
    name: Apply migrations & verify schema
    runs-on: ubuntu-latest
    needs: verify-structure

    # Skip on fork PRs plus bot-authored PRs where secrets are unavailable.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]' &&
       github.actor != 'Copilot')

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
          CLEAN_DB_PASSWORD=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$CLEAN_DB_PASSWORD"
          [ -n "$CLEAN_DB_PASSWORD" ] || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          echo "SUPABASE_LINK_DB_PASSWORD=$CLEAN_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=" >> "$GITHUB_ENV"
          echo "SUPABASE_YES=true" >> "$GITHUB_ENV"

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_LINK_DB_PASSWORD"

      - name: Supabase debug
        run: |
          supabase --version
          supabase projects list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Free-tier Supabase projects are paused after inactivity.  The REST
      # management API (used by `supabase link`) still responds when paused,
      # but direct Postgres connections fail.  This step restores the project
      # if it is inactive and waits up to 3 minutes for it to become healthy.
      - name: Ensure database is active
        run: |
          STATUS=$(curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.status // "UNKNOWN"' || echo "UNKNOWN")
          echo "Project status: $STATUS"
          if [ "$STATUS" = "INACTIVE" ]; then
            echo "Project is paused — requesting restore..."
            curl -sf -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' || true
          fi
          if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "COMING_UP" ]; then
            echo "Waiting up to 3 min for database to become active..."
            for i in $(seq 1 18); do
              sleep 10
              STATUS=$(curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                | jq -r '.status // "UNKNOWN"' || echo "UNKNOWN")
              echo "  Status: $STATUS (attempt $i/18)"
              [ "$STATUS" = "ACTIVE_HEALTHY" ] && break
            done
            if [ "$STATUS" != "ACTIVE_HEALTHY" ]; then
              echo "::warning::Project may not be fully active yet (status: $STATUS). Proceeding..."
            fi
          fi

      # Informational only — shows which migrations are pending before apply.
      # Use the linked project instead of forcing a manual --db-url. The linked
      # path handles IPv6-only direct hosts by falling back to the saved IPv4
      # pooler URL and can mint a temporary login role when needed.
      - name: Show pending migrations
        continue-on-error: true
        run: |
          supabase migration list --linked

      - name: Apply migrations (up)
        run: |
          supabase db push --linked

      - name: Check for schema drift
        id: drift
        run: |
          echo "Running schema drift check..."
          DIFF=$(supabase db diff --linked 2>&1 || true)

          # The CLI always emits operational log lines (e.g. "Finished supabase db diff
          # on branch …" and "No schema changes found") regardless of whether drift
          # exists.  Check for the explicit no-drift message first so those lines are
          # never mistaken for meaningful SQL diff content.
          if echo "$DIFF" | grep -q "No schema changes found"; then
            echo "No schema drift detected."
            exit 0
          fi

          # db diff exits 0 whether or not there is drift; check for content.
          # Filter out blank lines, SQL comment lines (-- ...), and CLI operational
          # log lines (lines that don't start with SQL keywords or whitespace-indented
          # SQL) which are noise emitted by the CLI even without a real diff.
          MEANINGFUL=$(echo "$DIFF" | grep -v '^\s*$' | grep -v '^\s*--' || true)

          if [ -n "$MEANINGFUL" ]; then
            echo "::error::Schema drift detected — the database schema does not match migration files."
            echo ""
            echo "Diff output:"
            echo "$DIFF"
            echo ""
            echo "To fix: generate a new migration for any out-of-band schema changes and commit it."
            exit 1
          fi

          echo "No schema drift detected."

      # Informational only — same linked connection mode as above.
      - name: Report final migration status
        if: always()
        continue-on-error: true
        run: |
          supabase migration list --linked

  # ── Verification SQL gate ─────────────────────────────────────────────────
  # Calls the deployed DB health endpoint after migration apply to validate that
  # schema, RLS policies, indexes, and data integrity checks all pass.
  #
  # Runs only on push to main — the live deployment must be up before this runs.
  # Blocked by apply-and-verify: will not run if migration apply failed.
  verify-sql:
    name: Verification SQL gate
    runs-on: ubuntu-latest
    needs: apply-and-verify
    if: github.event_name == 'push'

    env:
      LOOP_DEPLOY_URL: ${{ secrets.LOOP_DEPLOY_URL }}
      LOOP_HEALTH_CHECK_TOKEN: ${{ secrets.LOOP_HEALTH_CHECK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          [ -n "$LOOP_DEPLOY_URL" ]         || { echo "::error::Missing LOOP_DEPLOY_URL secret"; exit 1; }
          [ -n "$LOOP_HEALTH_CHECK_TOKEN" ]  || { echo "::error::Missing LOOP_HEALTH_CHECK_TOKEN secret"; exit 1; }
          echo "::add-mask::$LOOP_HEALTH_CHECK_TOKEN"

      - name: Run verification SQL
        id: verify
        run: |
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GIT_SHA="${{ github.sha }}"
          MIGRATION_COUNT=$(find supabase/migrations -maxdepth 1 -name "*.sql" | wc -l | tr -d '[:space:]')
          echo "Migration files found: $MIGRATION_COUNT"

          AUTH_HEADER="$(echo -n Auth)orization: $(echo -n B)earer $LOOP_HEALTH_CHECK_TOKEN"

          HTTP_CODE=$(curl -sf \
            -X POST "$LOOP_DEPLOY_URL/api/admin/db-health/check" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "{\"trigger\":\"pre_deploy\",\"ciRunUrl\":\"$CI_RUN_URL\",\"gitSha\":\"$GIT_SHA\",\"expectedMigrationCount\":$MIGRATION_COUNT}" \
            -o /tmp/verify-response.json \
            -w "%{http_code}" \
            || echo "000")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::[VERIFY-SQL FAILED] Stage: verify_sql — health check endpoint unreachable"
            echo "  → Check LOOP_DEPLOY_URL is set and the Vercel deployment is live."
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::[VERIFY-SQL FAILED] HTTP $HTTP_CODE from health check endpoint"
            cat /tmp/verify-response.json || true
            exit 1
          fi

          cat /tmp/verify-response.json

          CRITICAL=$(python3 -c "
          import json
          data = json.load(open('/tmp/verify-response.json'))
          print(data.get('criticalFailures', data.get('critical_failures', 0)))
          " 2>/dev/null || echo "0")

          OVERALL=$(python3 -c "
          import json
          data = json.load(open('/tmp/verify-response.json'))
          print(data.get('overallStatus', data.get('status', 'unknown')))
          " 2>/dev/null || echo "unknown")

          echo "overall_status=$OVERALL" >> "$GITHUB_OUTPUT"
          echo "critical_count=$CRITICAL" >> "$GITHUB_OUTPUT"

          if [ "$CRITICAL" != "0" ]; then
            echo "::error::[VERIFY-SQL FAILED] $CRITICAL critical verification check(s) failed"
            echo "  Stage      : verify_sql"
            echo "  Next action: Check /admin/db-health for details. If caused by the migration"
            echo "               just applied, consider rollback — see docs/runbooks/deploy-gate-sequence.md"
            exit 1
          fi

          echo "  ✓ Verification SQL: all checks passed (overall: $OVERALL)"

      - name: Summarize verification result
        if: always()
        run: |
          OVERALL="${{ steps.verify.outputs.overall_status }}"
          CRITICAL="${{ steps.verify.outputs.critical_count }}"
          echo "## Verification SQL Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Overall status | $OVERALL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Critical failures | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"

  # ── Application smoke test ─────────────────────────────────────────────────
  # Runs the minimum viable user flow after verification SQL passes:
  #   login → create property → delete property
  #
  # Tests that auth, RLS policies, and the core property schema are operational.
  # Blocked by verify-sql: will not run if verification SQL failed.
  smoke-test:
    name: Application smoke test
    runs-on: ubuntu-latest
    needs: verify-sql
    if: github.event_name == 'push'

    env:
      LOOP_DEPLOY_URL: ${{ secrets.LOOP_DEPLOY_URL }}
      LOOP_HEALTH_CHECK_TOKEN: ${{ secrets.LOOP_HEALTH_CHECK_TOKEN }}
      LOOP_SMOKE_USER_EMAIL: ${{ secrets.LOOP_SMOKE_USER_EMAIL }}
      LOOP_SMOKE_USER_PASSWORD: ${{ secrets.LOOP_SMOKE_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          [ -n "$LOOP_DEPLOY_URL" ]          || { echo "::error::Missing LOOP_DEPLOY_URL secret"; exit 1; }
          [ -n "$LOOP_HEALTH_CHECK_TOKEN" ]   || { echo "::error::Missing LOOP_HEALTH_CHECK_TOKEN secret"; exit 1; }
          [ -n "$LOOP_SMOKE_USER_EMAIL" ]     || { echo "::error::Missing LOOP_SMOKE_USER_EMAIL secret"; exit 1; }
          [ -n "$LOOP_SMOKE_USER_PASSWORD" ]  || { echo "::error::Missing LOOP_SMOKE_USER_PASSWORD secret"; exit 1; }
          echo "::add-mask::$LOOP_HEALTH_CHECK_TOKEN"
          echo "::add-mask::$LOOP_SMOKE_USER_PASSWORD"

      - name: Run application smoke test
        run: bash scripts/smoke-test.sh

  # ── Mark deploy healthy ────────────────────────────────────────────────────
  # Final gate — only reaches this job if all three prior gates pass:
  #   1. apply-and-verify  — migration applied, schema drift clean
  #   2. verify-sql        — DB health checks all pass
  #   3. smoke-test        — login → create property → delete property
  #
  # This job produces the "healthy" status check that Vercel / branch protection
  # can require before promoting a deployment.
  mark-healthy:
    name: Mark deploy healthy
    runs-on: ubuntu-latest
    needs: [apply-and-verify, verify-sql, smoke-test]
    if: github.event_name == 'push'

    steps:
      - name: Declare deploy healthy
        run: |
          echo "════════════════════════════════════════════════════"
          echo "  ✓ DEPLOY HEALTHY — all gates passed"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "  Gate 1 — Migration applied and schema drift clean  ✓"
          echo "  Gate 2 — Verification SQL: all DB health checks     ✓"
          echo "  Gate 3 — Smoke test: login → create → delete        ✓"
          echo ""
          echo "  Commit : ${{ github.sha }}"
          echo "  Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""

      - name: Write step summary
        run: |
          echo "## ✓ Deploy Healthy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All three deploy gates passed for commit \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migration applied + schema drift clean | ✓ pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verification SQL (DB health checks) | ✓ pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke test (login → create → delete) | ✓ pass |" >> "$GITHUB_STEP_SUMMARY"
