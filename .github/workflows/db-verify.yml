name: DB Schema Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-structure:
    name: Verify migration structure & checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration file sequence and checksums
        run: bash scripts/verify-migrations.sh

  verify-schema:
    name: Verify schema & policies (live DB)
    runs-on: ubuntu-latest
    needs: verify-structure
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }

          CLEAN_DB_PASSWORD=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$CLEAN_DB_PASSWORD"
          [ -n "$CLEAN_DB_PASSWORD" ] || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }

          [ -n "$SUPABASE_DATABASE_URL" ] || { echo "::error::Missing SUPABASE_DATABASE_URL (set to Supabase pooler URI)"; exit 1; }
          echo "::add-mask::$SUPABASE_DATABASE_URL"

          echo "SUPABASE_LINK_DB_PASSWORD=$CLEAN_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=" >> "$GITHUB_ENV"
          echo "SUPABASE_YES=true" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$SUPABASE_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_LINK_DB_PASSWORD"

      - name: Ensure database is active
        run: |
          STATUS=$(curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.status // "UNKNOWN"' || echo "UNKNOWN")
          echo "Project status: $STATUS"

          if [ "$STATUS" = "INACTIVE" ]; then
            echo "Project is paused — requesting restore..."
            curl -sf -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' || true
          fi

          if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "COMING_UP" ]; then
            echo "Waiting up to 3 min for database to become active..."
            for i in $(seq 1 18); do
              sleep 10
              STATUS=$(curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                | jq -r '.status // "UNKNOWN"' || echo "UNKNOWN")
              echo "  Status: $STATUS (attempt $i/18)"
              [ "$STATUS" = "ACTIVE_HEALTHY" ] && break
            done
            if [ "$STATUS" != "ACTIVE_HEALTHY" ]; then
              echo "::warning::Project may not be fully active yet (status: $STATUS). Proceeding..."
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify schema (tables, columns, RLS)
        run: |
          set -o pipefail
          echo "## Schema Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run db:verify-schema 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify policies (RLS policy presence)
        run: |
          set -o pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Policy Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run db:verify-policies 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Drift check summary
    runs-on: ubuntu-latest
    needs: [verify-structure, verify-schema]
    if: always()
    steps:
      - name: Evaluate gate result
        run: |
          STRUCTURE="${{ needs.verify-structure.result }}"
          SCHEMA="${{ needs.verify-schema.result }}"

          echo "verify-structure: $STRUCTURE"
          echo "verify-schema   : $SCHEMA"

          if [ "$STRUCTURE" = "failure" ] || [ "$SCHEMA" = "failure" ]; then
            echo "::error::DB verification failed — see job details for drift categories."
            exit 1
          fi

          if [ "$STRUCTURE" = "success" ] && { [ "$SCHEMA" = "success" ] || [ "$SCHEMA" = "skipped" ]; }; then
            echo "DB verification passed — no drift detected."
          fi